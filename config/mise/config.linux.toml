[settings]
system_packages.managers = ["brew"]

[env]
LANG = "C.UTF-8"
LC_CTYPE = "C.UTF-8"

# User-facing Linux software. The built-in mise Homebrew implementation pours
# bottles directly into /home/linuxbrew/.linuxbrew without requiring brew.
[bootstrap.packages]
"brew:bash" = "latest"
"brew:bat" = "latest"
"brew:bitwarden-cli" = "latest"
"brew:btop" = "latest"
"brew:curl" = "latest"
"brew:deadnix" = "latest"
"brew:devenv" = "latest"
"brew:difftastic" = "latest"
"brew:direnv" = "latest"
"brew:eza" = "latest"
"brew:fastfetch" = "latest"
"brew:fzf" = "latest"
"brew:gawk" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:git-absorb" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-town" = "latest"
"brew:git-trim" = "latest"
"brew:gnu-sed" = "latest"
"brew:gnu-tar" = "latest"
"brew:harper" = "latest"
"brew:helix" = "latest"
"brew:htop" = "latest"
"brew:jq" = "latest"
"brew:lazygit" = "latest"
"brew:markdown-oxide" = "latest"
"brew:marksman" = "latest"
"brew:nix-direnv" = "latest"
"brew:nmap" = "latest"
"brew:pstree" = "latest"
"brew:pv" = "latest"
"brew:ripgrep" = "latest"
"brew:rlwrap" = "latest"
"brew:rumdl" = "latest"
"brew:snitch" = "latest"
"brew:socat" = "latest"
"brew:starship" = "latest"
"brew:tmux" = "latest"
"brew:unzip" = "latest"
"brew:wget" = "latest"
"brew:xz" = "latest"
"brew:yazi" = "latest"
"brew:yq" = "latest"
"brew:zip" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"
"brew:zstd" = "latest"
