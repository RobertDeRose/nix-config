# Contributor-only validation, formatting, and documentation tools. Machine
# convergence does not load this environment; use `mise -E dev install`.
[tools]
actionlint = "latest"
"aqua:Mic92/nixfmt-rs" = "latest"
cocogitto = "latest"
harper-cli = "latest"
hk = "latest"
"github:rust-lang/mdBook" = "latest"
"npm:@contextlint/cli" = { version = "latest", aube_args = "--allow-low-downloads" }
"npm:markdown-table-formatter" = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
typos = "latest"
uv = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "command -v hk >/dev/null && hk install --mise || true"
